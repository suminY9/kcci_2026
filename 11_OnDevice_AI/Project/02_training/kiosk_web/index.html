<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 무인 키오스크</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ═══ HEADER ═══ -->
    <header class="header">
        <div class="header-inner">
            <div class="header-left">
                <img src="/logo.png" alt="Logo" class="header-logo" onerror="this.style.display='none'">
                <div class="header-title-group">
                    <h1 class="header-title">스마트 무인 키오스크</h1>
                    <p class="header-subtitle">AI 자동 결제 시스템</p>
                </div>
            </div>
            <div class="header-right">
                <div class="header-clock" id="headerClock"></div>
            </div>
        </div>
    </header>

    <!-- ═══ MAIN LAYOUT ═══ -->
    <main class="main-layout">
        <!-- ── LEFT: Products ── -->
        <section class="products-section">
            <!-- Category Tabs -->
            <div class="category-tabs">
                <button class="tab-btn active" data-category="all">
                    <span class="tab-icon">🛒</span>
                    <span class="tab-label">전체 상품</span>
                    <span class="tab-count" id="countAll">0</span>
                </button>
                <button class="tab-btn" data-category="snack">
                    <span class="tab-icon">🍪</span>
                    <span class="tab-label">과자 / 스낵</span>
                    <span class="tab-count" id="countSnack">0</span>
                </button>
                <button class="tab-btn" data-category="drink">
                    <span class="tab-icon">🥤</span>
                    <span class="tab-label">음료</span>
                    <span class="tab-count" id="countDrink">0</span>
                </button>
            </div>

            <!-- Search Bar -->
            <div class="search-bar">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                </svg>
                <input type="text" id="searchInput" placeholder="상품명을 검색하세요..." autocomplete="off">
                <button class="search-clear" id="searchClear" title="지우기">✕</button>
            </div>

            <!-- Product Grid -->
            <div class="product-grid" id="productGrid">
                <!-- Products rendered by JS -->
            </div>

            <!-- Loading State -->
            <div class="loading-state" id="loadingState">
                <div class="spinner"></div>
                <p>상품을 불러오는 중...</p>
            </div>

            <!-- Empty State -->
            <div class="empty-state hidden" id="emptyState">
                <span class="empty-icon">🔍</span>
                <p>검색 결과가 없습니다</p>
            </div>
        </section>

        <!-- ── RIGHT: Cart ── -->
        <aside class="cart-section">
            <div class="cart-header">
                <h2 class="cart-title">
                    <span class="cart-icon">🛍️</span>
                    장바구니
                </h2>
                <span class="cart-badge" id="cartBadge">0</span>
            </div>

            <div class="cart-items" id="cartItems">
                <!-- Cart empty state -->
                <div class="cart-empty" id="cartEmpty">
                    <span class="cart-empty-icon">🛒</span>
                    <p>장바구니가 비어있습니다</p>
                    <p class="cart-empty-hint">상품을 터치하여 추가하세요</p>
                </div>
            </div>

            <div class="cart-footer">
                <div class="cart-summary">
                    <div class="summary-row">
                        <span>상품 수</span>
                        <span id="totalItems">0개</span>
                    </div>
                    <div class="summary-divider"></div>
                    <div class="summary-row total-row">
                        <span>총 금액</span>
                        <span class="total-price" id="totalPrice">₩0</span>
                    </div>
                </div>
                <div class="cart-actions">
                    <button class="btn-reset" id="btnReset">
                        <span>🔄</span> 초기화
                    </button>
                    <button class="btn-pay" id="btnPay" disabled>
                        <span>💳</span> 결제하기
                    </button>
                </div>
            </div>
        </aside>
    </main>

    <!-- ═══ PAYMENT OVERLAY ═══ -->
    <div class="payment-overlay hidden" id="paymentOverlay">
        <div class="payment-modal">
            <div class="payment-stage" id="paymentProcessing">
                <div class="payment-spinner"></div>
                <h2>결제 처리 중...</h2>
                <p class="payment-amount" id="paymentAmount">₩0</p>
            </div>
            <div class="payment-stage hidden" id="paymentSuccess">
                <div class="success-checkmark">
                    <svg viewBox="0 0 52 52">
                        <circle cx="26" cy="26" r="25" fill="none"/>
                        <path fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
                    </svg>
                </div>
                <h2>결제 완료!</h2>
                <p class="payment-amount" id="paymentAmountDone">₩0</p>
                <p class="payment-thanks">이용해 주셔서 감사합니다 🙏</p>
            </div>
        </div>
    </div>

    <!-- ═══ TOAST ═══ -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="app.js"></script>
</body>
</html>
